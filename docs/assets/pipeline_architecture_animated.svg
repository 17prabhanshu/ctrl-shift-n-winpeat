<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>

    <!-- Card Gradients with 3D Depth -->
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2a47" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06182c" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c124d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#190a2c" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="emeraldCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3829" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#062017" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2b0f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#241705" stop-opacity="0.95"/>
    </linearGradient>

    <!-- 3D Shadow Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00f2fe" flood-opacity="0.15"/>
    </filter>

    <filter id="hubGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#10b981" flood-opacity="0.45"/>
    </filter>

    <!-- Flowing conduit gradient -->
    <linearGradient id="flowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <style>
    .pulse-flow {
      stroke-dasharray: 8, 8;
      animation: dashMove 1.5s linear infinite;
    }
    .pulse-glow {
      animation: ringGlow 2.5s ease-in-out infinite;
    }
    .status-blink {
      animation: blink 1.2s ease-in-out infinite alternate;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 32; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes ringGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.03); }
    }
    @keyframes blink {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #ffffff; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="660" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Perspective Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="60" x2="1100" y2="60"/>
    <line x1="100" y1="200" x2="1100" y2="200"/>
    <line x1="100" y1="360" x2="1100" y2="360"/>
    <line x1="100" y1="520" x2="1100" y2="520"/>
    <line x1="280" y1="40" x2="280" y2="600"/>
    <line x1="580" y1="40" x2="580" y2="600"/>
    <line x1="880" y1="40" x2="880" y2="600"/>
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" class="title-text" font-size="20" letter-spacing="0.5">WORKFORCE INTELLIGENCE ENGINE</text>
    <text x="0" y="20" class="sub-text" font-size="12">End-to-End Context-Isolated Verification Pipeline • Live Execution Topology</text>
    
    <!-- Top-Right Status Pills -->
    <g transform="translate(780, -14)">
      <rect x="0" y="0" width="130" height="26" rx="13" fill="#062017" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="14" cy="13" r="4" fill="#10b981" class="status-blink"/>
      <text x="26" y="17" class="badge-text" fill="#34d399">CI VERIFIED: PASS</text>

      <rect x="145" y="0" width="145" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="159" cy="13" r="4" fill="#818cf8"/>
      <text x="171" y="17" class="badge-text" fill="#c7d2fe">ZERO FALSE JOINS</text>
    </g>
  </g>

  <!-- ==================== ANIMATED CONNECTING CONDUITS ==================== -->
  <g fill="none" stroke-width="2.5" opacity="0.85">
    <!-- Stream 1: Analytics Jobs -> Market & Skill -->
    <path d="M 230 150 L 370 150" stroke="#00f2fe" class="pulse-flow"/>
    <path d="M 230 150 Q 300 150 370 270" stroke="#00f2fe" class="pulse-flow"/>

    <!-- Stream 2: DS Jobs -> Market Intel -->
    <path d="M 230 270 L 370 150" stroke="#38bdf8" class="pulse-flow"/>

    <!-- Stream 3: JDS -> Technical Interaction -->
    <path d="M 230 390 L 370 390" stroke="#818cf8" class="pulse-flow"/>

    <!-- Stream 4: SDS -> Forensic Decision Tree -->
    <path d="M 230 510 L 370 510" stroke="#f59e0b" class="pulse-flow"/>

    <!-- Middle Lanes -> Central Evidence Registry Hub -->
    <path d="M 570 150 Q 660 150 710 300" stroke="#38bdf8" class="pulse-flow"/>
    <path d="M 570 270 Q 650 270 710 320" stroke="#a855f7" class="pulse-flow"/>
    <path d="M 570 390 Q 650 390 710 340" stroke="#818cf8" class="pulse-flow"/>
    <path d="M 570 510 Q 660 510 710 360" stroke="#f59e0b" class="pulse-flow"/>

    <!-- Registry Hub -> Output Deliverables -->
    <path d="M 870 310 Q 930 280 970 180" stroke="#10b981" class="pulse-flow"/>
    <path d="M 870 330 L 970 330" stroke="#10b981" class="pulse-flow"/>
    <path d="M 870 350 Q 930 380 970 480" stroke="#10b981" class="pulse-flow"/>
  </g>

  <!-- ==================== COLUMN 1: DATA SOURCES ==================== -->
  <!-- Header -->
  <text x="60" y="98" class="badge-text" fill="#38bdf8" letter-spacing="1">01 / ISOLATED SOURCES</text>

  <!-- Box 1: Analytics Jobs -->
  <g transform="translate(60, 115)" filter="url(#cardShadow)">
    <rect width="170" height="70" rx="10" fill="url(#cyanCard)" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="20" cy="24" r="5" fill="#38bdf8"/>
    <text x="32" y="27" class="title-text" font-size="12">Analytics Jobs</text>
    <text x="32" y="44" class="sub-text">15,841 raw postings</text>
    <text x="32" y="58" class="badge-text" fill="#38bdf8">100% Range Parsed</text>
  </g>

  <!-- Box 2: DS Jobs -->
  <g transform="translate(60, 235)" filter="url(#cardShadow)">
    <rect width="170" height="70" rx="10" fill="url(#cyanCard)" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="20" cy="24" r="5" fill="#38bdf8"/>
    <text x="32" y="27" class="title-text" font-size="12">DS Jobs Benchmark</text>
    <text x="32" y="44" class="sub-text">1,602 verified salaries</text>
    <text x="32" y="58" class="badge-text" fill="#38bdf8">100% LPA Parsed</text>
  </g>

  <!-- Box 3: JDS Skills -->
  <g transform="translate(60, 355)" filter="url(#cardShadow)">
    <rect width="170" height="70" rx="10" fill="url(#purpleCard)" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="20" cy="24" r="5" fill="#c084fc"/>
    <text x="32" y="27" class="title-text" font-size="12">JDS Junior Talent</text>
    <text x="32" y="44" class="sub-text">n = 139 candidates</text>
    <text x="32" y="58" class="badge-text" fill="#c084fc">5 Skill Dimensions</text>
  </g>

  <!-- Box 4: SDS Personality -->
  <g transform="translate(60, 475)" filter="url(#cardShadow)">
    <rect width="170" height="70" rx="10" fill="url(#amberCard)" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="20" cy="24" r="5" fill="#fbbf24"/>
    <text x="32" y="27" class="title-text" font-size="12">SDS Senior Leaders</text>
    <text x="32" y="44" class="sub-text">n = 161 practitioners</text>
    <text x="32" y="58" class="badge-text" fill="#fbbf24">Big Five Factors</text>
  </g>

  <!-- ==================== COLUMN 2: ANALYTICAL LANES ==================== -->
  <text x="370" y="98" class="badge-text" fill="#c084fc" letter-spacing="1">02 / EVIDENCE GENERATION</text>

  <!-- Box A: Market Intelligence -->
  <g transform="translate(370, 115)" filter="url(#cardShadow)">
    <rect width="200" height="70" rx="10" fill="url(#cyanCard)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="18" y="27" class="title-text" font-size="13">Market Intel Lane</text>
    <text x="18" y="44" class="sub-text">Hedonic wage regressions</text>
    <text x="18" y="58" class="badge-text" fill="#38bdf8">Kruskal-Wallis Tests</text>
  </g>

  <!-- Box B: Skill Ontology Engine -->
  <g transform="translate(370, 235)" filter="url(#cardShadow)">
    <rect width="200" height="70" rx="10" fill="url(#purpleCard)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="18" y="27" class="title-text" font-size="13">Skill Graph Engine</text>
    <text x="18" y="44" class="sub-text">Deterministic N-gram Alias Map</text>
    <text x="18" y="58" class="badge-text" fill="#c084fc">NetworkX Co-Occurrence</text>
  </g>

  <!-- Box C: JDS Interaction Modeling -->
  <g transform="translate(370, 355)" filter="url(#cardShadow)">
    <rect width="200" height="70" rx="10" fill="url(#purpleCard)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="18" y="27" class="title-text" font-size="13">Interaction Models</text>
    <text x="18" y="44" class="sub-text">Firth Penalized Likelihood</text>
    <text x="18" y="58" class="badge-text" fill="#c084fc">HC3 Robust Errors (p=0.14)</text>
  </g>

  <!-- Box D: SDS Forensic Audit -->
  <g transform="translate(370, 475)" filter="url(#cardShadow)">
    <rect width="200" height="70" rx="10" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="18" y="27" class="title-text" font-size="13">Forensic SDS Audit</text>
    <text x="18" y="44" class="sub-text">Depth-2 Decision Tree</text>
    <text x="18" y="58" class="badge-text" fill="#f59e0b">Rule Artifact Caught (91% AUC)</text>
  </g>

  <!-- ==================== COLUMN 3: CENTRAL EVIDENCE REGISTRY ==================== -->
  <text x="690" y="235" class="badge-text" fill="#34d399" letter-spacing="1">03 / GOVERNANCE HUB</text>

  <g transform="translate(690, 255)" filter="url(#hubGlow)">
    <rect width="180" height="150" rx="16" fill="url(#emeraldCard)" stroke="#10b981" stroke-width="2"/>
    
    <!-- Central Hexagon / Emblem -->
    <circle cx="90" cy="45" r="24" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="90" y="50" font-family="sans-serif" font-weight="900" font-size="15" fill="#34d399" text-anchor="middle">ER</text>
    
    <text x="90" y="90" class="title-text" font-size="13" text-anchor="middle">Evidence Registry</text>
    <text x="90" y="106" class="sub-text" text-anchor="middle">Programmatic Audit Rule</text>
    
    <!-- Status Tag -->
    <rect x="25" y="118" width="130" height="20" rx="10" fill="#022c22"/>
    <text x="90" y="132" class="badge-text" fill="#6ee7b7" text-anchor="middle">ZERO HARDCODED CLAIMS</text>
  </g>

  <!-- ==================== COLUMN 4: VERIFIED DELIVERABLES ==================== -->
  <text x="970" y="98" class="badge-text" fill="#38bdf8" letter-spacing="1">04 / AUDITED OUTPUTS</text>

  <!-- Output 1: Research Paper -->
  <g transform="translate(970, 145)" filter="url(#cardShadow)">
    <rect width="170" height="75" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="16" y="24" class="title-text" font-size="12">app_final_note.docx</text>
    <text x="16" y="42" class="sub-text">25-Page Empirical Paper</text>
    <text x="16" y="58" class="badge-text" fill="#38bdf8">Embedded Static Figures</text>
  </g>

  <!-- Output 2: Interactive 3D / SAS VA -->
  <g transform="translate(970, 295)" filter="url(#cardShadow)">
    <rect width="170" height="75" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="16" y="24" class="title-text" font-size="12">3D Skill Landscape</text>
    <text x="16" y="42" class="sub-text">Three.js WebGL + Vis.js</text>
    <text x="16" y="58" class="badge-text" fill="#c084fc">SAS VFL Ready Data</text>
  </g>

  <!-- Output 3: Verifiable JSON Ledgers -->
  <g transform="translate(970, 445)" filter="url(#cardShadow)">
    <rect width="170" height="75" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="24" class="title-text" font-size="12">Audited Ledgers</text>
    <text x="16" y="42" class="sub-text">cleaning_ledger.json</text>
    <text x="16" y="58" class="badge-text" fill="#34d399">evidence_registry.json</text>
  </g>

</svg>
