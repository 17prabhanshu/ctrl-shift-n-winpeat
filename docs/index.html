<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workforce Intelligence Engine — Interactive Visual Research Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080c14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }

    /* Top Navigation Switcher */
    .nav-bar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 30px;
      padding: 6px 12px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6);
      z-index: 100;
    }
    .nav-tab {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-tab:hover {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.05);
    }
    .nav-tab.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
    }

    /* Tab Content Views */
    .view-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
    }
    .view-panel.active { display: block; }

    /* Frame embeds */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* View 3: SVG Container */
    .svg-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 40px 20px;
      background: radial-gradient(circle at 50% 50%, #0d1527 0%, #060911 100%);
    }
    .svg-container img {
      max-width: 1200px;
      width: 95%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>

  <!-- Top Tab Switcher -->
  <nav class="nav-bar">
    <button class="nav-tab active" onclick="switchTab('3d')">
      <span>●</span> 3D Skill Manifold
    </button>
    <button class="nav-tab" onclick="switchTab('network')">
      <span>●</span> Force Network Graph
    </button>
    <button class="nav-tab" onclick="switchTab('pipeline')">
      <span>●</span> Animated Pipeline Topology
    </button>
  </nav>

  <!-- View 1: 3D Interactive Manifold -->
  <div id="view-3d" class="view-panel active">
    <iframe src="interactive_3d_landscape.html"></iframe>
  </div>

  <!-- View 2: Force Directed Network Graph -->
  <div id="view-network" class="view-panel">
    <iframe src="interactive_graph.html"></iframe>
  </div>

  <!-- View 3: Animated Pipeline SVG -->
  <div id="view-pipeline" class="view-panel">
    <div class="svg-container">
      <img src="assets/pipeline_architecture_animated.svg" alt="Animated Pipeline Topology" />
    </div>
  </div>

  <script>
    function switchTab(tabKey) {
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));

      if (tabKey === '3d') {
        document.querySelector('.nav-tab:nth-child(1)').classList.add('active');
        document.getElementById('view-3d').classList.add('active');
      } else if (tabKey === 'network') {
        document.querySelector('.nav-tab:nth-child(2)').classList.add('active');
        document.getElementById('view-network').classList.add('active');
      } else if (tabKey === 'pipeline') {
        document.querySelector('.nav-tab:nth-child(3)').classList.add('active');
        document.getElementById('view-pipeline').classList.add('active');
      }
    }
  </script>
</body>
</html>
